
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Tokens</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f1f5f9;
            --text: #1e293b;
            --spacing: 20px;
            --radius: 10px;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            margin: 0;
            padding: var(--spacing);
        }

        h1 {
            color: var(--primary);
            font-size: 36px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .card {
            background: white;
            padding: var(--spacing);
            border-radius: var(--radius);
        }
    </style>
</head>
<body>
    <h1>My Design System</h1>
    <div class="card">
        <h2>Typography and Design Tokens</h2>
        <p>This page uses reusable CSS variables for colors,
           spacing, and border radius.</p>
    </div>
</body>
</html>
