
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Navbar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            position: sticky;
            top: 0;
            background: #1e3a8a;
            color: white;
            padding: 15px;
            z-index: 10;
        }

        nav a {
            color: white;
            margin-right: 20px;
            text-decoration: none;
        }

        .card {
            position: relative;
            margin: 30px;
            width: 300px;
        }

        .card img {
            width: 100%;
            display: block;
            border-radius: 10px;
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            box-sizing: border-box;
        }

        .content {
            height: 1000px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
    </nav>

    <div class="card">
        <img src="https://placehold.co/300x200"
             alt="Project preview">
        <div class="overlay">
            <h3>My Project</h3>
            <p>Created with HTML and CSS.</p>
        </div>
    </div>

    <div class="content">
        <h2>Scroll Down</h2>
        <p>The navbar stays at the top while scrolling.</p>
    </div>
</body>
</html>
